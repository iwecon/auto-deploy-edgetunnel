name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Build and test
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Toolchain
        run: swift --version

      - name: Build release
        run: swift build --configuration release

      - name: Run tests
        run: swift test --parallel

      - name: Check installers
        run: |
          sh -n install.sh
          ruby -c Formula/edgetunnel.rb
